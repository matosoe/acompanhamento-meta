plugins { id 'com.android.application' }

android {
    namespace 'io.github.matosoe.controlehoras'
    compileSdk 37

    defaultConfig {
        applicationId 'io.github.matosoe.controlehoras'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas"]
            }
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        androidTest {
            assets.srcDirs += files("$projectDir/schemas")
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'
    implementation 'androidx.navigation:navigation-fragment:2.10.1'
    implementation 'androidx.navigation:navigation-ui:2.10.1'
    implementation 'androidx.room:room-runtime:2.8.5'
    annotationProcessor 'androidx.room:room-compiler:2.8.5'
    implementation 'com.androidplot:androidplot-core:1.6.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.room:room-testing:2.8.5'
}

configurations.configureEach {
    resolutionStrategy.force(
            'org.jetbrains.kotlinx:kotlinx-serialization-core:1.8.1',
            'org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:1.8.1',
            'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1',
            'org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.8.1'
    )
}

tasks.register('verifyNoDestructiveRoomMigration') {
    group = 'verification'
    description = 'Fails if production code opts into destructive Room migrations.'
    doLast {
        def prohibitedFiles = fileTree('src/main/java') {
            include '**/*.java'
        }.findAll { file -> file.getText('UTF-8').contains('fallbackToDestructiveMigration') }
        if (!prohibitedFiles.isEmpty()) {
            throw new GradleException('fallbackToDestructiveMigration is prohibited: ' + prohibitedFiles)
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyNoDestructiveRoomMigration')
}
